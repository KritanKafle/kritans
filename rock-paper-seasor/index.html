<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r-p-s</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>rock paper seasor</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="element/rock.png" alt="rock">
        </div>
        <div class="choice" id="paper">
            <img src="element/paper.png" alt="paper">
        </div>
        <div class="choice" id="scissor">
            <img src="element/scissor.jpg" alt="scissor">
        </div>
    </div>

    <div class="scoreboard">
        <div class="score">
            <p id="uscore">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="cscore">0</p>
            <p>comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">
            play your move
        </p>
    </div>

    <button id="resetbtn">
        reset
    </button>

    <script src="script.js"></script>
</body>
</html>
